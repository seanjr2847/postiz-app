name: Video Studio Check
on:
  push:
    branches: [video-studio]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false
      - name: Install deps
        run: pnpm install
      - name: Prisma generate (MarketingBrand/Variant client)
        run: pnpm run prisma-generate
      - name: Build backend (controller/service/provider/Prisma types)
        run: pnpm run build:backend
      - name: Build frontend (/video-studio page)
        run: pnpm run build:frontend
